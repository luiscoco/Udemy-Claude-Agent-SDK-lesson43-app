<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1600" viewBox="0 0 1740 1600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#087fff"/></marker></defs><rect width="1740" height="1600" fill="#f4f9ff"/><text x="40" y="52" font-family="Arial" font-size="34" fill="#101a44">Lesson 43 · Define → delegate → observe → verify</text><rect x="20" y="90" width="300" height="80" rx="16" fill="#087fff"/><text x="170" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">Student UI</text><path d="M170 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="370" y="90" width="300" height="80" rx="16" fill="#8838ff"/><text x="520" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">TypeScript host</text><path d="M520 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="720" y="90" width="300" height="80" rx="16" fill="#00a977"/><text x="870" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">Agent tool</text><path d="M870 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1070" y="90" width="300" height="80" rx="16" fill="#8838ff"/><text x="1220" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">Specialists</text><path d="M1220 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1420" y="90" width="300" height="80" rx="16" fill="#ee5425"/><text x="1570" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">Classroom files</text><path d="M1570 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><text x="180" y="227" fill="#142d53" font-family="Arial" font-size="24">1. Validate the classroom scenario</text><path d="M170 245 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="325" fill="#142d53" font-family="Arial" font-size="24">2. Define when and how a specialist works</text><path d="M520 343 H1220" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="423" fill="#142d53" font-family="Arial" font-size="24">3. Choose child tools and model</text><path d="M520 441 H1220" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="521" fill="#142d53" font-family="Arial" font-size="24">4. Attach definitions and enable Agent</text><path d="M520 539 H870" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="619" fill="#142d53" font-family="Arial" font-size="24">5. Observe a native delegation</text><path d="M520 637 H870" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="880" y="717" fill="#142d53" font-family="Arial" font-size="24">6. Observe a real specialist start</text><path d="M870 735 H1220" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="1230" y="815" fill="#142d53" font-family="Arial" font-size="24">7. Constrain reads and test execution</text><path d="M1220 833 H1570" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="913" fill="#142d53" font-family="Arial" font-size="24">8. Correlate child tools with the Agent call</text><path d="M1220 931 H170" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="1011" fill="#142d53" font-family="Arial" font-size="24">9. Separate child text from parent output</text><path d="M1220 1029 H170" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="1109" fill="#142d53" font-family="Arial" font-size="24">10. Recognize the Agent tool return</text><path d="M1220 1127 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="1207" fill="#142d53" font-family="Arial" font-size="24">11. Capture native child completion</text><path d="M1220 1225 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="1305" fill="#142d53" font-family="Arial" font-size="24">12. Observe filesystem agent definitions</text><path d="M520 1323 H1570" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="1403" fill="#142d53" font-family="Arial" font-size="24">13. Verify the fixture remains unchanged</text><path d="M520 1421 H1570" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/></svg>